<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>巫奉約身腦齡活｜會員問卷</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #204c3c; background: #f4f8f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .status { flex: none; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid #d8e5de; font-size: 14px; line-height: 1.5; background: #f4f8f6; }
    .status p { margin: 0; }
    .detail { color: #52645b; font-size: 12px; }
    .status[data-state="failed"] { color: #805020; }
    iframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; background: #f4f8f6; }
    iframe[hidden] { display: none; }
    .notice { padding: 28px 20px; line-height: 1.7; }
    .notice[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div id="status" class="status" role="status" aria-live="polite">
      <p id="statusText">正在連接 LINE…</p>
      <p id="statusDetail" class="detail">請稍候，問卷會自動顯示。</p>
    </div>
    <div id="notice" class="notice" hidden></div>
    <iframe id="surveyFrame" title="FlowWu 新會員問卷 V2" hidden
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <script>
  (function () {
    'use strict';

    // 上線前只需填入這兩個已核對的網址。此頁必須直接由固定的 HTTPS 網址開啟。
    var CONFIG = {
      LIFF_ID: '2010178081-N8atNKIK',
      GAS_EXEC_URL: 'https://script.google.com/macros/s/AKfycbz2GqoLeLden7ueAGODaXqFAd9PgHdMGxw-FuZxuMvAU7QaP_gjKdlGQH196d_AoHFs/exec',
      EXPECTED_HOST_URL: 'https://zxc461352.github.io/flowwu-survey/flowwu-v2-liff.html'
    };
    var SDK_URL = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    var SDK_TIMEOUT_MS = 10000;
    var INIT_TIMEOUT_MS = 12000;
    var PROFILE_TIMEOUT_MS = 8000;
    var SEND_TIMEOUT_MS = 8000;
    var FRAME_READY_TIMEOUT_MS = 20000;
    var MAX_SEND_RECORDS = 30;
    var VERSION = 1;   // 橋接訊息格式版本;作答內容協定版本為 protocol: 2(見 buildChatMessages)

    var statusBox = document.getElementById('status');
    var statusText = document.getElementById('statusText');
    var statusDetail = document.getElementById('statusDetail');
    var notice = document.getElementById('notice');
    var frame = document.getElementById('surveyFrame');
    var channel = '';
    var childOrigin = '';
    var childSource = null;
    var frameStarted = false;
    var frameReadyTimer = null;
    var sdkTimer = null;
    var initTimer = null;
    var profileTimer = null;
    var gasUrl;
    var sendRecords = Object.create(null);
    var sendRecordCount = 0;
    var line = { userId: '', displayName: '' };
    var liffState = {
      liffId: CONFIG.LIFF_ID,
      status: 'idle', inClient: null, isLoggedIn: null,
      profileStatus: 'idle', contextType: 'unknown'
    };
    var lastError = null;

    // 不把 SDK 錯誤原文、登入憑證或網址查詢參數傳給問卷。
    function safeError(stage, code, message) {
      return { stage: stage, code: code, message: message };
    }
    function sdkError(stage, err, fallback) {
      var rawCode = err && (err.code || err.status);
      var code = typeof rawCode === 'number' ? String(rawCode) : String(rawCode || 'SDK_ERROR');
      if (!/^[A-Za-z0-9_-]{1,60}$/.test(code)) code = 'SDK_ERROR';
      return safeError(stage, code, fallback);
    }
    function setStatus(text, detail, failed) {
      statusText.textContent = text;
      statusDetail.textContent = detail || '';
      statusBox.setAttribute('data-state', failed ? 'failed' : 'normal');
    }
    function showNotice(text) {
      notice.textContent = text;
      notice.hidden = false;
    }
    function makeChannel() {
      if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') {
        throw new Error('NO_SECURE_RANDOM');
      }
      var bytes = new Uint8Array(24);
      window.crypto.getRandomValues(bytes);
      return Array.prototype.map.call(bytes, function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    }
    function validId(id) {
      return typeof id === 'string' && /^[A-Za-z0-9_-]{1,120}$/.test(id);
    }
    function isGoogleContentOrigin(origin) {
      // 只接受 Google Apps Script 產生的 HTTPS HTML 執行網域。
      return typeof origin === 'string' &&
        /^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/.test(origin);
    }
    function isSurveySource(source) {
      // /exec 可能再包一層 Google HTML iframe；只檢查 Window 的父子關係，不讀取跨網域內容。
      try {
        var candidate = source;
        for (var depth = 0; candidate && depth < 5; depth++) {
          if (candidate === frame.contentWindow) return true;
          if (candidate === window || candidate.parent === candidate) return false;
          candidate = candidate.parent;
        }
      } catch (e) { return false; }
      return false;
    }
    function envelope(type, extra) {
      var data = { fwBridge: channel, version: VERSION, type: type };
      Object.keys(extra || {}).forEach(function (key) { data[key] = extra[key]; });
      return data;
    }
    function post(type, extra) {
      if (!childSource || !childOrigin) return;
      try { childSource.postMessage(envelope(type, extra), childOrigin); }
      catch (e) { /* 頁面已關閉時不再嘗試傳送。 */ }
    }
    function publishStatus() {
      post('FWV2_STATUS', {
        line: { userId: line.userId, displayName: line.displayName },
        liff: {
          liffId: liffState.liffId, status: liffState.status,
          inClient: liffState.inClient, isLoggedIn: liffState.isLoggedIn,
          profileStatus: liffState.profileStatus, contextType: liffState.contextType
        },
        error: lastError
      });
    }
    function refreshStatus() {
      if (liffState.status === 'ready') {
        if (liffState.inClient && liffState.profileStatus === 'ready') {
          setStatus('LINE 已連線', '填完問卷後，會嘗試回傳到剛才的聊天室。');
        } else if (!liffState.inClient) {
          setStatus('問卷可正常填寫', '請從 LINE 官方帳號的「開始填寫」開啟，才能回傳聊天室。', true);
        } else if (liffState.profileStatus === 'loading') {
          setStatus('LINE 已連線，正在取得個人資料…', '問卷會在確認連線後顯示。');
        } else {
          setStatus('問卷可正常填寫', '尚未取得 LINE 個人資料；請查看問卷中的連線檢查。', true);
        }
      } else if (liffState.status === 'loading') {
        setStatus('正在連接 LINE…', '請稍候，問卷會自動顯示。');
      } else {
        setStatus('問卷可正常填寫，LINE 連線尚未完成', '資料仍可保存；請查看問卷中的連線檢查。', true);
      }
      publishStatus();
    }
    function startFrame() {
      if (frameStarted) return;
      frameStarted = true;
      var iframeUrl = new URL(gasUrl.href);
      iframeUrl.searchParams.set('fwBridge', channel);
      iframeUrl.searchParams.set('fwBridgeVersion', String(VERSION));
      frame.src = iframeUrl.href;
      frame.hidden = false;
      frameReadyTimer = setTimeout(function () {
        if (childSource) return;
        setStatus('問卷尚未完成連線', '請確認 Apps Script 已更新部署為包含連線橋接的新版本。', true);
      }, FRAME_READY_TIMEOUT_MS);
    }
    function initFailed(error, status) {
      liffState.status = status || 'failed';
      liffState.profileStatus = 'unavailable';
      lastError = error;
      refreshStatus();
      startFrame();
    }
    function finishProfile(status, error) {
      clearTimeout(profileTimer);
      liffState.profileStatus = status;
      if (error) lastError = error;
      else lastError = null;
      refreshStatus();
      startFrame();
    }
    function afterInit() {
      clearTimeout(initTimer);
      liffState.status = 'ready';
      lastError = null;
      try { liffState.inClient = !!window.liff.isInClient(); }
      catch (e) { liffState.inClient = null; }
      try { liffState.isLoggedIn = !!window.liff.isLoggedIn(); }
      catch (e) { liffState.isLoggedIn = null; }
      try {
        var context = window.liff.getContext();
        var type = context && context.type;
        liffState.contextType = /^(utou|group|room|external|none)$/.test(type) ? type : 'unknown';
      } catch (e) { liffState.contextType = 'unknown'; }
      if (!liffState.isLoggedIn) {
        finishProfile('unavailable', safeError('profile', 'NOT_LOGGED_IN', 'LINE 尚未登入，因此沒有取得個人資料。'));
        return;
      }
      liffState.profileStatus = 'loading';
      refreshStatus();
      profileTimer = setTimeout(function () {
        finishProfile('timeout', safeError('profile', 'PROFILE_TIMEOUT', '取得個人資料等待超過 8 秒；稍後成功會自動更新。'));
      }, PROFILE_TIMEOUT_MS);
      try {
        Promise.resolve(window.liff.getProfile()).then(function (profile) {
          if (!profile || typeof profile.userId !== 'string' || !profile.userId) {
            finishProfile('failed', safeError('profile', 'EMPTY_PROFILE', 'LINE 未回傳可用的個人資料。'));
            return;
          }
          line.userId = profile.userId;
          line.displayName = typeof profile.displayName === 'string' ? profile.displayName : '';
          finishProfile('ready', null);
        }, function (err) {
          finishProfile('failed', sdkError('profile', err, 'LINE 個人資料讀取失敗。'));
        });
      } catch (err) {
        finishProfile('failed', sdkError('profile', err, 'LINE 個人資料讀取失敗。'));
      }
    }
    function initSdk() {
      clearTimeout(sdkTimer);
      if (!window.liff || typeof window.liff.init !== 'function') {
        initFailed(safeError('sdk', 'SDK_UNAVAILABLE', 'LINE 程式載入失敗。'));
        return;
      }
      liffState.status = 'loading';
      refreshStatus();
      initTimer = setTimeout(function () {
        initFailed(safeError('init', 'INIT_TIMEOUT', 'LINE 初始化等待超過 12 秒；稍後成功會自動更新。'), 'timeout');
      }, INIT_TIMEOUT_MS);
      try {
        // 保留網址上的 liff.* 參數，直到 init 成功。此頁沒有自動改寫網址或登入重新導向。
        Promise.resolve(window.liff.init({ liffId: CONFIG.LIFF_ID })).then(afterInit, function (err) {
          clearTimeout(initTimer);
          initFailed(sdkError('init', err, 'LINE 初始化失敗。'));
        });
      } catch (err) {
        clearTimeout(initTimer);
        initFailed(sdkError('init', err, 'LINE 初始化失敗。'));
      }
    }
    function loadSdk() {
      liffState.status = 'loading';
      refreshStatus();
      var script = document.createElement('script');
      script.src = SDK_URL;
      script.async = true;
      sdkTimer = setTimeout(function () {
        initFailed(safeError('sdk', 'SDK_TIMEOUT', 'LINE 程式載入等待超過 10 秒；稍後成功會自動更新。'), 'timeout');
      }, SDK_TIMEOUT_MS);
      script.onload = initSdk;
      script.onerror = function () {
        clearTimeout(sdkTimer);
        initFailed(safeError('sdk', 'SDK_LOAD_FAILED', 'LINE 程式載入失敗。'));
      };
      document.head.appendChild(script);
    }



    // ============================================================
    //  共用核心與問卷設定(與 Apps Script 後端、問卷頁是同一份,由建置程式貼入,請勿手改)
    //  入口頁只信任「引擎重播過的答案」,聊天室訊息一律由這裡依答案重新產生。
    // ============================================================
//@@BEGIN SurveyCore
/*
 * FlowWu｜新會員分流問卷 v2 －－ 共用核心 (survey-core.js)
 * 同一份程式同時用在三個地方（由建置程式自動貼入，請勿各自手改）：
 *   1. Apps Script 後端 (SurveyCore.gs)   ：重播驗證答案、產生 Sheet 欄位與標籤
 *   2. Apps Script 問卷頁 (Script.html)   ：畫面流程、完成頁紀錄
 *   3. GitHub 入口頁 (flowwu-v2-liff.html)：重播驗證答案、產生聊天室訊息
 *
 * 第一部分「引擎」為規格 survey-engine.js 的原樣內容（邏輯未改寫）。
 * 第二部分是驗證、訊息與資料欄位的工具函式，全部以「重播」為基礎：
 * 不信任任何外來資料，一律由引擎依設定檔從第一題重新走一遍，路徑與答案都符合才接受。
 */
var SurveyCore = (function () {
  "use strict";

  // =====================================================================
  //  第一部分：引擎（規格 survey-engine.js 原樣）
  // =====================================================================
  function createEngine(config) {
    const FINISH = config.settings.finish || "FINISH";
    const byId = {};
    config.questions.forEach((q) => { byId[q.id] = q; });

    // answers：每題最後一次的答案（單選＝選項 id；複選＝選項 id 陣列）
    // history：實際走過、已作答的題目 id（依順序）＝最後送出的路徑
    // pending：目前這題複選中、尚未按「沒有了」的已選項目
    const state = { answers: {}, history: [], current: null, pending: [] };

    // 只採計 history 內的答案：回上一題改答後，舊分支的答案不會影響判斷
    function values(qid) {
      if (!state.history.includes(qid)) return [];
      const a = state.answers[qid];
      return a == null ? [] : [].concat(a);
    }

    // 條件：{q,in} 單選答案在清單內／複選任一已選在清單內；{q,notIn}；{all:[…]}；{any:[…]}
    // 尚未作答的題目，條件一律不成立
    function evalCond(c) {
      if (!c) return true;
      if (c.all) return c.all.every(evalCond);
      if (c.any) return c.any.some(evalCond);
      const v = values(c.q);
      if (c.in) return v.some((x) => c.in.includes(x));
      if (c.notIn) return v.length > 0 && !v.some((x) => c.notIn.includes(x));
      return false;
    }

    function resolveNext(q) {
      if (typeof q.next === "string") return q.next;
      for (const rule of q.next) {
        if (!rule.if || evalCond(rule.if)) return rule.goto;
      }
      return FINISH;
    }

    // 從 id 往後找第一個要顯示的題目：showIf 不成立就跳過
    function settle(id) {
      let guard = 0;
      while (id !== FINISH) {
        if (guard++ > 200) throw new Error("routing loop at " + id);
        const q = byId[id];
        if (!q) throw new Error("unknown question: " + id);
        if (q.showIf && !evalCond(q.showIf)) { id = resolveNext(q); continue; }
        return id;
      }
      return FINISH;
    }

    function enter(id) {
      state.current = settle(id);
      const q = byId[state.current];
      // 再次來到複選題（例如回上一題）時，帶入先前的選擇，直接顯示追問畫面
      state.pending = q && q.type === "multi" ? [].concat(state.answers[q.id] || []) : [];
      return state.current;
    }

    function commit(q) {
      state.history.push(q.id);
      return enter(resolveNext(q));
    }

    function currentQuestion() { return byId[state.current] || null; }

    function isExclusive(q, optionId) {
      const o = q.options.find((x) => x.id === optionId);
      return !!(o && o.exclusive);
    }

    function start() {
      state.answers = {};
      state.history = [];
      state.pending = [];
      return enter(config.settings.start);
    }

    // 點選項目：單選 → 直接下一題；複選 → 加入已選，留在本題顯示「還有其他嗎？」
    function pick(optionId) {
      const q = currentQuestion();
      if (!q) return state.current;
      const opt = q.options.find((o) => o.id === optionId);
      if (!opt) throw new Error("unknown option " + optionId + " in " + q.id);

      if (q.type === "single") {
        state.answers[q.id] = optionId;
        return commit(q);
      }
      if (opt.exclusive) {               // 獨佔選項（如「時間都可以」）：只選它並直接下一題
        state.pending = [optionId];
        state.answers[q.id] = [optionId];
        return commit(q);
      }
      state.pending = state.pending.filter((id) => !isExclusive(q, id));
      if (!state.pending.includes(optionId)) state.pending.push(optionId);
      state.answers[q.id] = [].concat(state.pending);
      if (remaining().length === 0) return commit(q);   // 全部選完 → 自動下一題
      return state.current;
    }

    // 追問畫面的剩餘選項：不含已選、不含獨佔選項
    function remaining() {
      const q = currentQuestion();
      if (!q || q.type !== "multi") return [];
      return q.options.filter((o) => !o.exclusive && !state.pending.includes(o.id));
    }

    // 移除已選標籤；移到 0 項時自動回到第一輪
    function unpick(optionId) {
      const q = currentQuestion();
      if (!q || q.type !== "multi") return state.current;
      state.pending = state.pending.filter((id) => id !== optionId);
      state.answers[q.id] = [].concat(state.pending);
      return state.current;
    }

    // 「沒有了，下一題」
    function done() {
      const q = currentQuestion();
      if (!q || q.type !== "multi" || state.pending.length === 0) return state.current;
      state.answers[q.id] = [].concat(state.pending);
      return commit(q);
    }

    // 上一題：回到前一個已作答題目，保留它的答案供修改
    function back() {
      const prev = state.history.pop();
      if (!prev) return state.current;
      state.current = prev;
      const q = byId[prev];
      state.pending = q.type === "multi" ? [].concat(state.answers[prev] || []) : [];
      return state.current;
    }

    // 畫面狀態
    function phase() {
      const q = currentQuestion();
      if (!q) return "finish";
      if (q.type === "single") return "single";
      return state.pending.length ? "multi-more" : "multi-first";
    }

    // 預估總題數＝已答題數＋從目前題目往後模擬（未作答條件視為不成立），每答一題重算
    function projectedTotal() {
      let n = state.history.length;
      let id = state.current;
      let guard = 0;
      while (id && id !== FINISH && guard++ < 200) {
        const q = byId[id];
        if (!q.showIf || evalCond(q.showIf)) n++;
        id = resolveNext(q);
      }
      return n;
    }

    function optionOf(q, optionId) {
      return q.options.find((x) => x.id === optionId) || { id: optionId, label: optionId };
    }

    // 送出用結果：只含實際路徑上的題目
    function result() {
      const path = [].concat(state.history);
      const answers = {};
      path.forEach((id) => { answers[id] = state.answers[id]; });
      const tags = [];
      const lines = [];
      path.forEach((id) => {
        const q = byId[id];
        const opts = [].concat(answers[id]).map((x) => optionOf(q, x));
        opts.forEach((o) => tags.push((q.tag || q.short) + "_" + (o.tag || o.label)));
        lines.push(q.short + "：" + opts.map((o) => o.label).join("、"));
      });
      const segment = answers.need || null;
      const closings = (config.finish && config.finish.closingBySegment) || {};
      const closing = closings[segment] || (config.finish && config.finish.closingDefault) || "";
      // 完成頁提示卡（例如：想要教練培訓 → 請在官方 LINE 預約），依 showIf 決定是否出現
      const notices = ((config.finish && config.finish.notices) || []).filter((n) => evalCond(n.showIf));
      return { version: config.meta.version, segment, path, answers, tags, lines, closing, notices };
    }

    return {
      start, pick, unpick, done, back, phase, remaining, projectedTotal, result,
      currentQuestion, evalCond, state, byId, FINISH,
    };
  }

  // =====================================================================
  //  第二部分：重播驗證、聊天室訊息、Sheet 欄位
  // =====================================================================

  function fail(code, detail) { return { ok: false, code: code, detail: detail || '' }; }

  function hasOwn(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  /** 清理使用者自由輸入文字：移除控制字元／不可見方向字元、合併空白、限制長度。 */
  function cleanText(value, maxLength) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/[\u0000-\u001f\u007f-\u009f]/g, ' ')
      .replace(/[​-‏‪-‮⁠-⁯⁦-⁩﻿]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, maxLength);
  }

  /**
   * 重播驗證：把外來資料 {path, answers, otherText} 交給引擎從第一題重走一遍。
   * 只有「路徑、題型、選項、獨佔規則」全部吻合才算通過，回傳引擎算出的標準結果。
   * （路徑上沒有的題目不可帶答案；複選一律依設定檔順序重播，所以結果順序固定。）
   */
  function replay(config, submission) {
    if (!submission || typeof submission !== 'object' || Array.isArray(submission)) return fail('FORMAT');
    var path = submission.path;
    var answers = submission.answers;
    if (!Array.isArray(path) || path.length < 1 || path.length > 40) return fail('FORMAT', 'path');
    if (!answers || typeof answers !== 'object' || Array.isArray(answers)) return fail('FORMAT', 'answers');

    var engine = createEngine(config);
    engine.start();
    var i = 0;
    while (engine.phase() !== 'finish') {
      if (i >= path.length) return fail('PATH', 'too short');
      var q = engine.currentQuestion();
      if (path[i] !== q.id) return fail('PATH', q.id);
      if (!hasOwn(answers, q.id)) return fail('ANSWER', q.id);
      var a = answers[q.id];
      var ids = q.options.map(function (o) { return o.id; });
      if (q.type === 'single') {
        if (typeof a !== 'string' || ids.indexOf(a) === -1) return fail('ANSWER', q.id);
        engine.pick(a);
      } else {
        if (!Array.isArray(a) || a.length < 1 || a.length > ids.length) return fail('ANSWER', q.id);
        var seen = {};
        for (var j = 0; j < a.length; j++) {
          if (typeof a[j] !== 'string' || ids.indexOf(a[j]) === -1 || seen[a[j]]) return fail('ANSWER', q.id);
          seen[a[j]] = true;
        }
        var exclusiveId = null;
        q.options.forEach(function (o) { if (o.exclusive && seen[o.id]) exclusiveId = o.id; });
        if (exclusiveId && a.length !== 1) return fail('ANSWER', q.id);
        // 依設定檔的選項順序重播（排除順序差異）；全選完會由引擎自動前進，之後不能再點
        var ordered = ids.filter(function (id) { return seen[id]; });
        for (var k = 0; k < ordered.length && engine.currentQuestion() === q; k++) engine.pick(ordered[k]);
        if (engine.currentQuestion() === q) engine.done();
      }
      i++;
    }
    if (i !== path.length) return fail('PATH', 'too long');
    var extra = Object.keys(answers).filter(function (k) { return path.indexOf(k) === -1; });
    if (extra.length) return fail('ANSWER', 'unexpected ' + extra[0]);

    // 「其他」身份說明：只有選了該選項才接受
    var ot = (config.settings && config.settings.otherText) || null;
    var otherText = '';
    if (ot) {
      var chosen = engine.state.answers[ot.question];
      var picked = path.indexOf(ot.question) !== -1 && chosen && [].concat(chosen).indexOf(ot.option) !== -1;
      var raw = submission.otherText;
      if (raw !== undefined && raw !== null && typeof raw !== 'string') return fail('OTHER');
      if (picked) otherText = cleanText(raw, ot.maxLength || 60);
      else if (raw) return fail('OTHER', 'not selected');
    }
    return { ok: true, result: engine.result(), otherText: otherText, engine: engine };
  }

  function questionMap(config) {
    var m = {};
    config.questions.forEach(function (q) { m[q.id] = q; });
    return m;
  }

  function labelOf(q, optionId) {
    var o = q.options.filter(function (x) { return x.id === optionId; })[0];
    return o ? o.label : optionId;
  }

  /** 每題「欄位名稱」(short)：自由輸入文字裡若出現「欄位名稱：」會被改成「欄位名稱・」，避免偽造關鍵字。 */
  function neutralizeFreeText(config, text) {
    var names = [];
    config.questions.forEach(function (q) { if (names.indexOf(q.short) === -1) names.push(q.short); });
    names.push(config.finish.recordTitle);
    names.push('感興趣');   // 舊版「感興趣」欄位名稱（Chatisfy 仍可能保留該規則，一併防護）
    var out = text;
    names.forEach(function (n) {
      out = out.split(n + '：').join(n + '・').split(n + ':').join(n + '・');
    });
    // 標題關鍵字本身也不讓使用者重複輸入
    out = out.split(config.finish.recordTitle).join(config.finish.recordTitle.split('').join(' '));
    return out;
  }

  /**
   * 作答內容各行（不含問候語與結尾）。
   * 會被 Chatisfy 貼標籤的題目（lineMode: perOption，如身份）每個選項各占一行；
   * 其他題目同一題合併成一行，用「、」串起來。
   */
  function buildRecordLines(config, result, otherText) {
    var qm = questionMap(config);
    var lines = [];
    var ot = (config.settings && config.settings.otherText) || null;
    result.path.forEach(function (id) {
      var q = qm[id];
      var ids = [].concat(result.answers[id]);
      var labels = ids.map(function (x) { return labelOf(q, x); });
      if (q.lineMode === 'perOption') {
        labels.forEach(function (l) { lines.push(q.short + '：' + l); });
      } else {
        lines.push(q.short + '：' + labels.join('、'));
      }
      if (ot && ot.question === id && ids.indexOf(ot.option) !== -1 && otherText) {
        lines.push('其他身份補充：' + neutralizeFreeText(config, otherText));
      }
    });
    return lines;
  }

  /** 完整聊天室訊息：問候 → 標題 → 分隔線 → 作答 → 分隔線 → 收尾句 → 提示 → 固定結尾。 */
  function buildChatMessage(config, result, otherText) {
    var f = config.finish;
    var out = [].concat(f.intro, ['📋 ' + f.recordTitle, f.divider], buildRecordLines(config, result, otherText), [f.divider]);
    if (result.closing) out.push(result.closing);
    result.notices.forEach(function (n) { if (n.line) out.push(n.line); });
    out.push(f.finalLine);
    return out.join('\n');
  }

  /** V2 標籤字串（寫入 Sheet 的「V2標籤」欄）：V2｜題目標籤｜選項標籤。 */
  function buildTags(config, result) {
    var qm = questionMap(config);
    var tags = [];
    result.path.forEach(function (id) {
      var q = qm[id];
      [].concat(result.answers[id]).forEach(function (x) {
        var o = q.options.filter(function (y) { return y.id === x; })[0];
        tags.push('V2｜' + (q.tag || q.short) + '｜' + ((o && o.tag) || (o && o.label) || x));
      });
    });
    return tags;
  }

  /** 某題在試算表中用「、」串起來的選項文字。 */
  function joinedLabels(config, result, qid) {
    if (result.path.indexOf(qid) === -1) return '';
    var q = questionMap(config)[qid];
    return [].concat(result.answers[qid]).map(function (x) { return labelOf(q, x); }).join('、');
  }

  /**
   * 寫入 Google Sheet 的欄位（以「標題名稱」為鍵）。
   * 舊有欄位（地區、身份…）沿用；新增欄位放在表格最右邊。
   */
  function buildSheetFields(config, result, otherText) {
    var qm = questionMap(config);
    var branchLines = [];
    result.path.forEach(function (id) {
      var q = qm[id];
      if (q.branch && q.branch !== 'X') branchLines.push(q.short + '：' + joinedLabels(config, result, id));
    });
    var segment = '';
    if (result.segment) {
      var needQ = qm.need;
      segment = labelOf(needQ, result.segment);
    }
    return {
      '地區': joinedLabels(config, result, 'region'),
      '身份': joinedLabels(config, result, 'identity'),
      '其他身份說明': otherText || '',
      '年齡': joinedLabels(config, result, 'age'),
      '主要需求': joinedLabels(config, result, 'need'),
      '興趣': '',
      '參與方式': joinedLabels(config, result, 'mode'),
      '方便時段': joinedLabels(config, result, 'time'),
      'V2標籤': buildTags(config, result).join(', '),
      '流程版本': String(config.meta.version),
      '分支': segment,
      '分支題作答': branchLines.join('；'),
      '教練培訓興趣': joinedLabels(config, result, 'X1'),
      '課程意願': joinedLabels(config, result, 'course_intent'),
      '每堂可接受費用': joinedLabels(config, result, 'price'),
      '作答路徑': result.path.join('>'),
      '作答JSON': JSON.stringify(result.answers)
    };
  }

  /** 新增欄位（舊表沒有時，由後端自動補在最右邊）。 */
  var NEW_SHEET_HEADERS = ['流程版本', '分支', '分支題作答', '教練培訓興趣', '課程意願', '每堂可接受費用', '作答路徑', '作答JSON'];

  /** 設定檔自我檢查：下一題指向的題目都存在、沒有孤兒題、每個選項 id 不重複。回傳問題清單。 */
  function lintConfig(config) {
    var problems = [];
    var qm = questionMap(config);
    var ids = config.questions.map(function (q) { return q.id; });
    ids.forEach(function (id, i) { if (ids.indexOf(id) !== i) problems.push('題目 id 重複：' + id); });
    var FIN = config.settings.finish || 'FINISH';
    function target(t, from) { if (t !== FIN && !qm[t]) problems.push(from + ' 指向不存在的題目 ' + t); }
    if (!qm[config.settings.start]) problems.push('start 不存在');
    var reached = {};
    config.questions.forEach(function (q) {
      var oids = q.options.map(function (o) { return o.id; });
      oids.forEach(function (id, i) { if (oids.indexOf(id) !== i) problems.push(q.id + ' 選項 id 重複：' + id); });
      if (typeof q.next === 'string') { target(q.next, q.id); reached[q.next] = true; }
      else (q.next || []).forEach(function (r) { target(r.goto, q.id); reached[r.goto] = true; });
    });
    reached[config.settings.start] = true;
    ids.forEach(function (id) { if (!reached[id]) problems.push('孤兒題（沒有任何題目指向它）：' + id); });
    return problems;
  }

  return {
    createEngine: createEngine,
    replay: replay,
    buildRecordLines: buildRecordLines,
    buildChatMessage: buildChatMessage,
    buildTags: buildTags,
    buildSheetFields: buildSheetFields,
    NEW_SHEET_HEADERS: NEW_SHEET_HEADERS,
    cleanText: cleanText,
    lintConfig: lintConfig
  };
})();

    var CONFIG_PROBLEMS = SurveyCore.lintConfig(SURVEY_CONFIG);

    /** 驗證問卷頁送來的作答並產生聊天室訊息。失敗回傳 null。 */
    function buildChatMessages(data) {
      if (CONFIG_PROBLEMS.length) return { error: 'CONFIG', message: '入口頁的問卷設定檢查未通過。' };
      if (data.protocol !== 2 || !data.submission || typeof data.submission !== 'object' || Array.isArray(data.submission)) {
        return { error: 'INVALID_ANSWERS', message: '問卷版本與入口頁不一致，請重新從官方帳號開啟問卷。' };
      }
      var replayed = SurveyCore.replay(SURVEY_CONFIG, data.submission);
      if (!replayed.ok) return { error: 'INVALID_ANSWERS', message: '作答紀錄與問卷流程不一致。' };
      var text = SurveyCore.buildChatMessage(SURVEY_CONFIG, replayed.result, replayed.otherText);
      if (typeof text !== 'string' || !text || text.length > 4800) return { error: 'INVALID_ANSWERS', message: '中文作答紀錄格式不正確。' };
      return { messages: [{ type: 'text', text: text }] };
    }

    function sendResult(requestId, submissionId, status, error) {
      post('FWV2_SEND_RESULT', {
        requestId: requestId, submissionId: submissionId, status: status,
        error: error || null
      });
    }
    function notifyRecord(record) {
      Object.keys(record.requests).forEach(function (requestId) {
        sendResult(requestId, record.submissionId, record.status, record.error);
      });
    }
    function handleSend(data) {
      if (!validId(data.requestId) || !validId(data.submissionId)) return;
      var built = buildChatMessages(data);
      if (built.error) {
        sendResult(data.requestId, data.submissionId, 'failed', safeError('send', built.error, built.message));
        return;
      }
      var messages = built.messages;
      var fingerprint = JSON.stringify(messages);
      var old = sendRecords[data.submissionId];
      if (old) {
        if (old.fingerprint !== fingerprint) {
          sendResult(data.requestId, data.submissionId, 'failed', safeError('send', 'SUBMISSION_MISMATCH', '同一份問卷的回傳指令不一致。'));
          return;
        }
        old.requests[data.requestId] = true;
        if (old.status !== 'pending') {
          sendResult(data.requestId, data.submissionId, old.status, old.error);
        }
        return;
      }
      if (sendRecordCount >= MAX_SEND_RECORDS) {
        sendResult(data.requestId, data.submissionId, 'failed', safeError('send', 'SEND_LIMIT', '此頁的回傳次數已達上限。'));
        return;
      }
      if (liffState.status !== 'ready' || !liffState.inClient || !liffState.isLoggedIn ||
          !window.liff || typeof window.liff.sendMessages !== 'function') {
        sendResult(data.requestId, data.submissionId, 'failed', safeError('send', 'LIFF_NOT_READY', 'LINE 連線尚未就緒，問卷資料已保存。'));
        return;
      }
      if (!/^(utou|group|room)$/.test(liffState.contextType)) {
        sendResult(data.requestId, data.submissionId, 'failed', safeError('send', 'NO_CHAT_CONTEXT', '請從官方帳號聊天室的按鈕開啟問卷。'));
        return;
      }
      var record = {
        submissionId: data.submissionId, fingerprint: fingerprint,
        requests: Object.create(null), status: 'pending', error: null, timer: null
      };
      record.requests[data.requestId] = true;
      sendRecords[data.submissionId] = record;
      sendRecordCount++;
      record.timer = setTimeout(function () {
        if (record.status !== 'pending') return;
        // 不確定是否已送出時，保留紀錄，避免重送造成聊天室重複訊息。
        record.status = 'unknown';
        record.error = safeError('send', 'SEND_TIMEOUT', '尚未確認訊息是否送出；請查看聊天室，稍後結果會自動更新。');
        notifyRecord(record);
      }, SEND_TIMEOUT_MS);
      try {
        Promise.resolve(window.liff.sendMessages(messages)).then(function () {
          clearTimeout(record.timer);
          record.status = 'sent';
          record.error = null;
          notifyRecord(record);
        }, function (err) {
          clearTimeout(record.timer);
          record.status = 'failed';
          record.error = sdkError('send', err, 'LINE 拒絕回傳訊息，問卷資料已保存。');
          notifyRecord(record);
        });
      } catch (err) {
        clearTimeout(record.timer);
        record.status = 'failed';
        record.error = sdkError('send', err, 'LINE 回傳訊息失敗，問卷資料已保存。');
        notifyRecord(record);
      }
    }
    function handleClose(data) {
      if (!validId(data.requestId)) return;
      if (liffState.status !== 'ready' || !liffState.inClient ||
          !window.liff || typeof window.liff.closeWindow !== 'function') {
        post('FWV2_ACTION_RESULT', { requestId: data.requestId, action: 'close', status: 'failed',
          error: safeError('close', 'CLOSE_UNAVAILABLE', '請點畫面右上角的關閉按鈕返回 LINE。') });
        return;
      }
      try {
        window.liff.closeWindow();
        post('FWV2_ACTION_RESULT', { requestId: data.requestId, action: 'close', status: 'success', error: null });
      } catch (err) {
        post('FWV2_ACTION_RESULT', { requestId: data.requestId, action: 'close', status: 'failed',
          error: sdkError('close', err, '請點畫面右上角的關閉按鈕返回 LINE。') });
      }
    }
    function onMessage(event) {
      var data = event.data;
      if (!data || typeof data !== 'object' || Array.isArray(data) ||
          data.version !== VERSION || data.fwBridge !== channel ||
          !frameStarted || !isSurveySource(event.source) || !isGoogleContentOrigin(event.origin)) return;
      if (data.type === 'FWV2_READY') {
        if (childSource && (event.source !== childSource || event.origin !== childOrigin)) return;
        childSource = event.source;
        childOrigin = event.origin;
        clearTimeout(frameReadyTimer);
        publishStatus();
        return;
      }
      if (!childSource || event.source !== childSource || event.origin !== childOrigin) return;
      if (data.type === 'FWV2_SEND') handleSend(data);
      else if (data.type === 'FWV2_CLOSE') handleClose(data);
    }

    function start() {
      try {
        gasUrl = new URL(CONFIG.GAS_EXEC_URL);
        var expected = new URL(CONFIG.EXPECTED_HOST_URL);
        if (gasUrl.protocol !== 'https:' || gasUrl.hostname !== 'script.google.com' ||
            !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(gasUrl.pathname) || gasUrl.search || gasUrl.hash ||
            expected.protocol !== 'https:' || expected.search || expected.hash ||
            expected.origin !== window.location.origin || expected.pathname !== window.location.pathname) {
          throw new Error('INVALID_CONFIG');
        }
        if (window.top !== window.self) throw new Error('TOP_LEVEL_REQUIRED');
        channel = makeChannel();
      } catch (err) {
        setStatus('此頁的連線設定尚未完成', '請先核對固定問卷網址與 Apps Script 的 /exec 網址。', true);
        showNotice('問卷入口需要使用已核對的 HTTPS 固定網址，並填入目前使用的 Apps Script 部署網址。設定完成後再從 LINE 官方帳號開啟。');
        return;
      }
      window.addEventListener('message', onMessage);
      loadSdk();
    }
    start();
  })();
